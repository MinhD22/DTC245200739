services:

  mysql:
    image: mysql:8.0
    container_name: recipe-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: recipe_db
      MYSQL_USER: recipe_user
      MYSQL_PASSWORD: RecipeUser@2026!
      MYSQL_ROOT_PASSWORD: RecipeRoot@2026!
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - recipe_network

  wordpress:
    image: wordpress:php8.2-apache
    container_name: recipe-wordpress
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: recipe_db
      WORDPRESS_DB_USER: recipe_user
      WORDPRESS_DB_PASSWORD: RecipeUser@2026!
    volumes:
      - wordpress_data:/var/www/html
    
    networks:
      - recipe_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: recipe-phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8081:80"
    networks:
      - recipe_network
  nginx:
    image: nginx:alpine
    container_name: recipe-nginx
    restart: unless-stopped
    depends_on:
      - wordpress
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - recipe_network
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.1
    container_name: recipe-nginx-exporter
    restart: unless-stopped
    depends_on:
      - nginx
    command:
      - "--nginx.scrape-uri=http://nginx:8080/stub_status"
    networks:
      - recipe_network
  prometheus:
    image: prom/prometheus:latest
    container_name: recipe-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - recipe_network

  grafana:
    image: grafana/grafana:latest
    container_name: recipe-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - recipe_network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: recipe-cadvisor
    restart: unless-stopped
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - recipe_network

  mysql-exporter:
    image: prom/mysqld-exporter:v0.14.0
    container_name: recipe-mysql-exporter
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      DATA_SOURCE_NAME: "recipe_user:RecipeUser@2026!@(mysql:3306)/"
    ports:
      - "9104:9104"
    networks:
      - recipe_network


volumes:
  mysql_data:
  wordpress_data:
  prometheus_data:
  grafana_data:

networks:
  recipe_network:
    driver: bridge